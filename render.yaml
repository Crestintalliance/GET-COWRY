# Render Blueprint: website, API and database for JoinCowry.
# In Render: New → Blueprint → pick this repo. Secrets marked `sync: false` are asked for on first deploy.
# Plan names change over time; if Render rejects one, pick the closest plan in the dashboard.

databases:
  - name: cowry-db
    region: virginia
    plan: basic-256mb
    databaseName: cowry
    user: cowry

services:
  # Backend API: api.joincowry.com
  - type: web
    name: cowry-api
    runtime: node
    region: virginia
    plan: starter # always on; the free plan sleeps and would miss Stripe webhooks
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @cowry/api build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_WEB_URL
        value: https://joincowry.com
      - key: CORS_EXTRA_ORIGINS
        value: https://www.joincowry.com,https://cowry-web.onrender.com,https://cowry-app.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: cowry-db
          property: connectionString
      - key: SUPPLIER
        value: mock # sample plans; switch to airalo once the Airalo keys are set
      - key: SUPPLIER_ROUTES # countries sold by a specific supplier; Guinea is better value on eSIM Access
        value: GN:esimaccess
      - key: AIRALO_CLIENT_ID
        sync: false
      - key: AIRALO_CLIENT_SECRET
        sync: false
      - key: ESIMACCESS_ACCESS_CODE
        sync: false
      - key: ESIMACCESS_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_TOKEN # password for the recommendation review screen at joincowry.com/admin; 24+ characters
        sync: false
      - key: GOOGLE_PLACES_API_KEY # optional: restaurant and sight listings in guides
        sync: false
      - key: PRICE_MIN_PROFIT_USD
        value: "4"
      - key: PRICE_MIN_MARKUP
        value: "1.25"

  # Website: joincowry.com and www.joincowry.com
  - type: web
    name: cowry-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @cowry/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://cowry-api.onrender.com
      - key: VITE_WHATSAPP_NUMBER
        sync: false
    routes:
      # Single-page app: every path loads index.html, React decides what to show.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # Phone app preview in the browser: cowry-app.onrender.com (the real apps ship through the App Store and Google Play)
  - type: web
    name: cowry-app
    runtime: static
    buildCommand: cd apps/mobile && npm ci && npx expo export --platform web
    staticPublishPath: apps/mobile/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
