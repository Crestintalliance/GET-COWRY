# Render Blueprint: website, API and database for Get Cowry.
# In Render: New → Blueprint → pick this repo. Secrets marked `sync: false` are asked for on first deploy.
# Plan names change over time; if Render rejects one, pick the closest plan in the dashboard.

databases:
  - name: cowry-db
    region: virginia
    plan: basic-256mb
    databaseName: cowry
    user: cowry

services:
  # Backend API: api.getcowry.com
  - type: web
    name: cowry-api
    runtime: node
    region: virginia
    plan: starter # always on; the free plan sleeps and would miss Stripe webhooks
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @cowry/api build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_WEB_URL
        value: https://getcowry.com
      - key: CORS_EXTRA_ORIGINS
        value: https://www.getcowry.com
      - key: DATABASE_URL
        fromDatabase:
          name: cowry-db
          property: connectionString
      - key: SUPPLIER
        value: esimaccess
      - key: ESIMACCESS_ACCESS_CODE
        sync: false
      - key: ESIMACCESS_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PRICE_MIN_PROFIT_USD
        value: "4"
      - key: PRICE_MIN_MARKUP
        value: "1.25"

  # Website: getcowry.com and www.getcowry.com
  - type: web
    name: cowry-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @cowry/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://api.getcowry.com
      - key: VITE_WHATSAPP_NUMBER
        sync: false
    routes:
      # Single-page app: every path loads index.html, React decides what to show.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
